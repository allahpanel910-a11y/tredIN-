<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b4fcf">
<meta name="tredin-build" content="PRODUCTION API-READY">
<meta name="description" content="TredIN trading platform — frontend complete, ready for API integration">
<title>TredIN — Trading Platform</title>
<style>
:root{
  --blue:#1769e0;
  --blue2:#123b68;
  --blue-soft:#eaf1ff;
  --gold:#c9a227;
  --gold2:#a8841a;
  --gold-soft:#fbf6e6;
  --ink:#0c1829;
  --muted:#5a6a7e;
  --line:#e3e9f2;
  --bg:#f3f6fb;
  --card:#ffffff;
  --good:#0d8a4a;
  --bad:#c92a2a;
  --warn:#b86e00;
  --shadow:0 8px 28px rgba(12,35,70,.08);
  --r:14px;
}
*{box-sizing:border-box}
html,body{
  margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
::selection{background:rgba(11,79,207,.15);color:var(--ink)}

/* Production interaction helpers */
.btn:disabled,.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn.busy{position:relative;pointer-events:none;opacity:.8}
.btn.busy::after{
  content:"";width:14px;height:14px;margin-left:8px;border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:50%;display:inline-block;vertical-align:-2px;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.preapi-banner{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  margin:0 0 14px;padding:10px 14px;border-radius:12px;
  background:linear-gradient(135deg,#f7faff 0%,#fbf8ef 100%);
  border:1px solid rgba(201,162,39,.28);color:#3d4f66;font-size:12px;
}
.preapi-banner strong{color:var(--blue)}
.empty{
  text-align:center;padding:36px 16px;color:var(--muted);
  border:1px dashed var(--line);border-radius:12px;background:#fafbfc;
}
.skeleton{
  background:linear-gradient(90deg,#eef2f7 25%,#f7f9fc 50%,#eef2f7 75%);
  background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:8px;height:14px;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Auth gate — real login shell; OTP appears only when backend requires verification. */
.auth-gate{
  position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  padding:20px;background:
    radial-gradient(1200px 600px at 10% -10%,rgba(11,79,207,.18),transparent 55%),
    radial-gradient(900px 500px at 100% 0%,rgba(201,162,39,.14),transparent 50%),
    linear-gradient(165deg,#0c1829 0%,#13233d 45%,#0b4fcf 160%);
}
.auth-panel{
  width:100%;max-width:400px;background:#fff;border-radius:18px;padding:28px 24px 22px;
  box-shadow:0 28px 60px rgba(0,0,0,.35);border:1px solid rgba(201,162,39,.2);
}
.auth-brand{
  font-size:28px;font-weight:850;letter-spacing:-.6px;text-align:center;
  background:linear-gradient(135deg,var(--blue),#1a6ef0 55%,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.auth-logo-mark{
  width:64px;height:64px;margin:0 auto 14px;border-radius:18px;display:grid;place-items:center;
  background:linear-gradient(150deg,#4b96ff 0%,var(--blue) 45%,var(--gold2) 135%);
  border:1px solid rgba(255,255,255,.5);
  box-shadow:inset 0 3px 3px rgba(255,255,255,.5),inset 0 -4px 7px rgba(0,0,0,.18),
             0 5px 0 rgba(8,61,166,.45),0 16px 28px rgba(11,79,207,.35);
}
.auth-logo-mark svg{width:32px;height:32px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 2px rgba(0,0,0,.22))}
.auth-tagline{text-align:center;color:var(--muted);margin:4px 0 14px;font-size:13px}
.auth-mode-pill{
  display:block;text-align:center;font-size:10px;font-weight:800;letter-spacing:.06em;
  color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:5px 10px;margin:0 auto 16px;width:fit-content;
  border:1px solid #c5d4f5;
}
.auth-err{color:var(--bad);font-size:12px;font-weight:700;margin:8px 0 0}
.auth-panel .field{margin-bottom:12px}
.auth-panel .field label{display:block;font-size:12px;font-weight:700;color:#4a5a6e;margin-bottom:5px}
.auth-panel .field input{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;outline:none;
}
.auth-panel .field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,79,207,.14)}

/* KYC document upload slots */
.upload-slot{
  border:1px dashed #c5d0e0;border-radius:12px;padding:14px;background:#fafbfd;
  transition:border-color .15s,background .15s;
}
.upload-slot.is-uploading{border-color:var(--blue);background:var(--blue-soft)}
.upload-slot.is-ok{border-color:#b6e4c8;background:#f3fbf6;border-style:solid}
.upload-slot.is-fail{border-color:#f0b4b4;background:#fff7f7;border-style:solid}
.upload-slot .us-title{font-weight:750;font-size:13px;margin:0 0 4px}
.upload-slot .us-meta{font-size:12px;color:var(--muted);margin:0 0 10px}
.upload-slot .us-progress{
  height:6px;border-radius:99px;background:#e3e9f2;overflow:hidden;margin:8px 0;
}
.upload-slot .us-progress > i{
  display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),#3b82f6);
  border-radius:99px;transition:width .2s ease;
}
.upload-slot .us-file{font-size:12px;font-weight:650;word-break:break-all}
.upload-slot input[type=file]{font-size:12px;width:100%}

/* ---------- BUTTON MICRO-UX: clean icon + subtle motion ---------- */
.btn{min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;white-space:nowrap;line-height:1}
.btn::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.42) 50%,transparent 62%);transform:translateX(-120%);transition:transform .45s ease;pointer-events:none}
.btn:hover::before{transform:translateX(120%)} .btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(1px) scale(.985)}
.btn .btn-icon{width:24px;height:24px;flex:0 0 24px;display:grid;place-items:center;border-radius:8px;background:rgba(12,35,70,.06);transition:transform .2s ease,box-shadow .2s ease}
.btn .btn-icon svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn:hover .btn-icon{transform:translateY(-1px) rotate(-2deg);box-shadow:0 3px 8px rgba(12,35,70,.12)}
.btn.primary .btn-icon,.btn.gold .btn-icon,.btn.danger .btn-icon{background:rgba(255,255,255,.15);color:#fff}.btn.ghost .btn-icon{background:rgba(11,79,207,.08);color:var(--blue)}
.btn.busy .btn-icon{animation:buttonIconPulse .9s ease-in-out infinite}@keyframes buttonIconPulse{50%{transform:scale(.88);opacity:.7}}
@media(max-width:760px){.btn{min-height:40px;padding:9px 12px}.btn .btn-icon{width:23px;height:23px;flex-basis:23px}}
@media(prefers-reduced-motion:reduce){.btn,.btn::before,.btn .btn-icon{transition:none!important;animation:none!important}.btn:hover,.btn:active{transform:none}}

/* ---------- CINEMATIC 3D BUTTON SYSTEM ---------- */
.btn{
  border-radius:12px;
  box-shadow:
    0 1px 0 rgba(255,255,255,.65) inset,
    0 -6px 10px rgba(12,35,70,.05) inset,
    0 1px 0 rgba(12,35,70,.06),
    0 8px 18px rgba(12,35,70,.12);
  transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .16s ease,filter .16s ease;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 -6px 10px rgba(12,35,70,.05) inset,0 2px 0 rgba(12,35,70,.08),0 14px 26px rgba(12,35,70,.16)}
.btn:active{transform:translateY(1px) scale(.98);box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 2px 6px rgba(12,35,70,.14)}
.btn.primary{box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 3px 0 var(--blue2),0 14px 26px rgba(11,79,207,.32)}
.btn.primary:hover{box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 4px 0 var(--blue2),0 18px 32px rgba(11,79,207,.38)}
.btn.primary:active{box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 1px 0 var(--blue2),0 6px 14px rgba(11,79,207,.26)}
.btn.danger{box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 3px 0 #8f1a22,0 14px 24px rgba(201,42,42,.30)}
.btn.danger:hover{box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 4px 0 #8f1a22,0 18px 30px rgba(201,42,42,.36)}
.btn.trade-buy{box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 3px 0 #086b3b,0 14px 24px rgba(13,138,74,.28)!important}
.btn.trade-buy:hover{box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 4px 0 #086b3b,0 18px 30px rgba(13,138,74,.34)!important}
.btn.trade-sell{box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 3px 0 #8f1a22,0 14px 24px rgba(201,42,42,.28)!important}
.btn.trade-sell:hover{box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 4px 0 #8f1a22,0 18px 30px rgba(201,42,42,.34)!important}
.btn.gold{box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 3px 0 var(--gold2),0 14px 24px rgba(201,162,39,.30)}
.btn.gold:hover{box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 4px 0 var(--gold2),0 18px 30px rgba(201,162,39,.36)}
.btn.ghost{box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 3px 0 #b6cff7,0 10px 18px rgba(11,79,207,.16)}

/* app-icon style 3D badge for icons inside buttons */
.btn .btn-icon{
  border-radius:8px;
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.55),
    inset 0 -2px 3px rgba(0,0,0,.14),
    0 2px 5px rgba(0,0,0,.18);
}
.btn.primary .btn-icon,.btn.danger .btn-icon,.btn.gold .btn-icon,.btn.trade-buy .btn-icon,.btn.trade-sell .btn-icon{
  background:rgba(255,255,255,.20);
}
.btn:hover .btn-icon{transform:translateY(-1px) rotate(-4deg) scale(1.06)}
.btn:active .btn-icon{transform:translateY(0) scale(.94)}

/* Compact action buttons inside data tables (Manage/View/Details/Open etc.) */
.table td .btn{min-height:30px!important;padding:6px 10px!important;font-size:12px;border-radius:9px;gap:5px}
.table td .btn .btn-icon{width:16px!important;height:16px!important;flex-basis:16px!important;border-radius:6px}
.table td .btn .btn-icon svg{width:10px!important;height:10px!important}

@media(prefers-reduced-motion:reduce){
  .btn,.btn .btn-icon{transition:none!important}
  .btn:hover,.btn:active,.btn:hover .btn-icon,.btn:active .btn-icon{transform:none!important}
}

/* ---------- TRADING ACTION BUTTONS: professional execution UI ---------- */
.trade-action{min-height:44px!important;min-width:108px;padding:10px 16px!important;border-radius:11px!important;font-weight:800!important;letter-spacing:.01em;position:relative;isolation:isolate;box-shadow:0 5px 14px rgba(12,35,70,.10)!important}
.trade-action .btn-icon{width:27px!important;height:27px!important;flex-basis:27px!important;border-radius:9px!important}
.trade-action .btn-icon svg{width:15px!important;height:15px!important;stroke-width:2.1!important}
.trade-buy{background:linear-gradient(145deg,#118a55,#08733f)!important;color:#fff!important;border-color:#086b3b!important;box-shadow:0 6px 16px rgba(13,138,74,.25)!important}
.trade-buy:hover{background:linear-gradient(145deg,#16a565,#08733f)!important;box-shadow:0 9px 20px rgba(13,138,74,.32)!important}
.trade-sell{background:linear-gradient(145deg,#d04444,#b51f2a)!important;color:#fff!important;border-color:#a91c27!important;box-shadow:0 6px 16px rgba(201,42,42,.23)!important}
.trade-sell:hover{background:linear-gradient(145deg,#e15252,#b51f2a)!important;box-shadow:0 9px 20px rgba(201,42,42,.30)!important}
.order-primary{min-height:46px!important;padding:11px 18px!important;border-radius:12px!important;font-weight:800!important;box-shadow:0 7px 18px rgba(11,79,207,.26)!important}
.order-primary .btn-icon{width:28px!important;height:28px!important;border-radius:9px!important}
.order-secondary{min-height:44px!important}
.order-tabs{display:grid!important;grid-template-columns:1fr 1fr;gap:8px!important;padding:5px!important;background:#f4f7fb;border:1px solid var(--line);border-radius:13px;margin-bottom:16px}
.order-tabs .trade-action{width:100%;border:0!important;box-shadow:none!important;min-height:44px!important}
.order-tabs .trade-action:not(.trade-buy):not(.trade-sell){background:transparent!important;color:var(--muted)!important}
.execution-hint{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:11px;color:var(--muted)}
.execution-dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px rgba(13,138,74,.10);animation:executionPulse 1.8s ease-in-out infinite}
@keyframes executionPulse{50%{transform:scale(1.18);opacity:.7}}
@media(max-width:760px){.trade-action{min-height:42px!important;min-width:96px;padding:9px 12px!important}.order-primary{width:100%;min-height:46px!important}.order-secondary{min-height:42px!important}}
@media(prefers-reduced-motion:reduce){.execution-dot{animation:none!important}}

/* Top bar */
.top{
  height:62px;background:linear-gradient(180deg,#ffffff 0%,#fbfdff 100%);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 20px;
  position:sticky;top:0;z-index:30;
  box-shadow:0 1px 0 rgba(201,162,39,.12);
}
.brand{
  display:inline-flex;align-items:center;gap:9px;
  font-size:22px;font-weight:850;letter-spacing:-.6px;
  background:linear-gradient(135deg,var(--blue) 0%,#1a6ef0 55%,var(--gold) 130%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand-mark{
  width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(150deg,#4b96ff 0%,#0b4fcf 48%,var(--gold2) 135%);
  border:1px solid rgba(255,255,255,.5);
  box-shadow:inset 0 2px 2px rgba(255,255,255,.5),inset 0 -3px 5px rgba(0,0,0,.16),
             0 3px 0 rgba(8,61,166,.45),0 10px 18px rgba(11,79,207,.32);
  transition:transform .2s cubic-bezier(.2,.8,.2,1);
}
.brand-mark svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.22))}
.brand:hover .brand-mark{transform:translateY(-1px) rotate(-4deg)}
@media(prefers-reduced-motion:reduce){.brand-mark{transition:none!important}.brand:hover .brand-mark{transform:none!important}}
.search{flex:1;max-width:440px}
.search input{
  width:100%;border:1px solid var(--line);border-radius:11px;
  padding:10px 14px;outline:none;background:#fafbfc;transition:.18s;
}
.search input:focus{
  border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,79,207,.14);
  background:#fff;
}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill,.btn{
  border:1px solid var(--line);background:#fff;border-radius:10px;
  padding:8px 14px;font-weight:650;color:var(--ink);transition:.18s ease;
}
.pill:hover,.btn:hover{background:#f5f8fc;border-color:#cfd8e6}
.btn.primary{
  background:linear-gradient(145deg,var(--blue),var(--blue2));
  color:#fff;border-color:var(--blue2);
  box-shadow:0 4px 12px rgba(11,79,207,.28);
}
.btn.primary:hover{
  background:linear-gradient(145deg,#1a63e0,var(--blue2));
  box-shadow:0 6px 16px rgba(11,79,207,.35);
  transform:translateY(-1px);
}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{color:var(--blue);border-color:#c5d4f5;background:var(--blue-soft)}
.btn.ghost:hover{background:#dce8ff;border-color:#a8c0f0}
.btn.gold{
  background:linear-gradient(145deg,var(--gold),var(--gold2));
  color:#fff;border-color:var(--gold2);
  box-shadow:0 4px 12px rgba(201,162,39,.28);
}
.btn.gold:hover{filter:brightness(1.05);transform:translateY(-1px)}

/* Layout */
.layout{display:flex}
.side{
  width:228px;background:linear-gradient(180deg,#ffffff 0%,#fafbfd 100%);
  border-right:1px solid var(--line);
  min-height:calc(100vh - 62px);padding:16px 12px;
  position:sticky;top:62px;height:calc(100vh - 62px);overflow-y:auto;
}
.navgroup{
  margin:14px 10px 6px;color:#8a95a4;font-size:10px;
  text-transform:uppercase;font-weight:750;letter-spacing:.55px;
}
.nav button{
  width:100%;text-align:left;border:0;background:transparent;
  padding:10px 12px;border-radius:10px;color:#354356;font-weight:550;
  transition:background .15s ease,color .15s ease,box-shadow .15s ease;
}
.nav button.active,.nav button:hover{
  background:var(--blue-soft);color:var(--blue);font-weight:700;
}
.nav button.active{
  box-shadow:inset 3px 0 0 var(--gold);
}
.main{flex:1;min-width:0;padding:22px 22px 28px;max-width:1440px;margin:0 auto;width:100%}

/* Page */
.page-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:14px;margin-bottom:18px;flex-wrap:wrap;
  padding-bottom:14px;border-bottom:1px solid rgba(227,233,242,.85);
}
.page-head h1{
  font-size:23px;margin:0;font-weight:800;letter-spacing:-.4px;
  color:var(--ink);
}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);padding:18px;
  transition:box-shadow .2s ease,border-color .2s ease,transform .2s ease;
}
.card:hover{border-color:#cdd8e8;box-shadow:0 10px 32px rgba(12,35,70,.1)}
/* KPI metric cards */
.kpi-card{
  position:relative;overflow:hidden;
  background:linear-gradient(165deg,#ffffff 0%,#f8fafd 100%);
  border-left:3px solid var(--blue);
}
.kpi-card::after{
  content:"";position:absolute;top:0;right:0;width:56px;height:56px;
  background:radial-gradient(circle at top right,rgba(201,162,39,.12),transparent 70%);
  pointer-events:none;
}
.card .label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.metric{
  font-size:24px;font-weight:800;margin-top:6px;letter-spacing:-.5px;
  font-variant-numeric:tabular-nums;color:#0f1c2e;
}
.kpi-note{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.35}
.section{margin-top:20px}
.section h2{
  font-size:15px;margin:0 0 12px;font-weight:750;letter-spacing:-.2px;
  color:#1a2740;
}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Tables */
.tablewrap{overflow:auto;border-radius:10px}
.table{width:100%;border-collapse:collapse;min-width:640px}
.table th,.table td{
  text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.table th{
  font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:750;
  letter-spacing:.35px;background:#f8fafc;
}
.table tbody tr{transition:background .12s ease}
.table tbody tr:hover{background:#f7f9fc}
.positive{color:var(--good);font-weight:750}
.negative{color:var(--bad);font-weight:750}
.tag{
  display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;
  background:var(--blue-soft);color:var(--blue);font-size:11px;font-weight:750;
  letter-spacing:.2px;
}
.tag.good{background:#e6f7ef;color:var(--good)}
.tag.bad{background:#fff0f0;color:var(--bad)}
.tag.warn{background:#fff8e6;color:var(--warn)}
.tag.gold{background:var(--gold-soft);color:var(--gold2)}

/* Instrument cards */
.instrument{display:flex;justify-content:space-between;gap:12px;align-items:center}
.instrument h3{margin:0;font-size:15px;font-weight:750;letter-spacing:-.2px}
.price{font-size:21px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.chart{
  height:240px;border:1px solid var(--line);border-radius:12px;
  background:linear-gradient(180deg,#fff 0%,#f6f9fc 100%);position:relative;overflow:hidden;
}
.chart svg{width:100%;height:100%}

/* Forms */
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.field label{
  display:block;color:#4a5a6e;font-size:12px;font-weight:700;
  margin-bottom:5px;letter-spacing:.15px;
}
.field input,.field select{
  width:100%;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:#fff;outline:none;transition:.18s ease;
}
.field input:focus,.field select:focus{

.ui-state{display:flex;align-items:center;gap:10px;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--card);font-size:13px;font-weight:700}
.ui-state::before{content:"";width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 10%,transparent)}
.ui-state.success{color:var(--good);background:var(--success-soft);border-color:#ccebd9}.ui-state.error{color:var(--bad);background:var(--danger-soft);border-color:#f2caca}.ui-state.warning{color:var(--warn);background:var(--warning-soft);border-color:#f0ddb8}.ui-state.info{color:var(--blue);background:var(--info-soft);border-color:#cddcff}
.ui-loading{position:relative;overflow:hidden;color:transparent!important;background:linear-gradient(100deg,#eef2f7 30%,#fff 45%,#eef2f7 60%);background-size:220% 100%;animation:tredinShimmer 1.25s linear infinite;border-color:transparent}
.ui-loading>*{visibility:hidden}.ui-loading::after{content:"";position:absolute;left:12px;right:12px;top:50%;height:8px;transform:translateY(-50%);border-radius:99px;background:rgba(90,106,126,.14)}
@keyframes tredinShimmer{to{background-position:-220% 0}}
.api-boundary{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--muted);background:#f7f9fc;border:1px dashed #cbd5e3;border-radius:8px;padding:5px 8px;display:inline-flex;align-items:center;gap:6px}
@media(max-width:700px){.ui-state{min-height:42px}.api-boundary{font-size:10px}}
@media(prefers-reduced-motion:reduce){.ui-loading{animation:none;background:#eef2f7}}

<script>
"use strict";
/* =========================================================
   TredIN — Clean Professional Build
   Secure session-gated workspace.
   ========================================================= */

const MASTER = {
  segments: {
    equity:   { name: "Equity",          exchanges: ["NSE","BSE"], product: ["CNC","MIS"], unit: "shares" },
    futures:  { name: "Futures",         exchanges: ["NSE"],       product: ["NRML","MIS"], unit: "lots" },
    options:  { name: "Options",         exchanges: ["NSE"],       product: ["NRML","MIS"], unit: "lots" },
    commodity:{ name: "Commodity",       exchanges: ["MCX"],       product: ["NRML","MIS"], unit: "lots" },
    forex:    { name: "Forex / Currency",exchanges: ["NSE"],       product: ["NRML","MIS"], unit: "lots" }
  },
  instruments: [
    { id:"RELIANCE",     symbol:"RELIANCE",      name:"Reliance Industries",      exchange:"NSE", segment:"equity", price:null,  lotSize:1,   multiplier:1, tick:0.05 },
    { id:"TCS",          symbol:"TCS",           name:"Tata Consultancy Services",exchange:"NSE", segment:"equity", price:null,  lotSize:1,   multiplier:1, tick:0.05 },
    { id:"SBIN",         symbol:"SBIN",          name:"State Bank of India",      exchange:"NSE", segment:"equity", price:null,   lotSize:1,   multiplier:1, tick:0.05 },
    { id:"NIFTYFUT",     symbol:"NIFTY",         name:"NIFTY Index Future",       exchange:"NSE", segment:"futures", price:null, lotSize:75,  multiplier:1, tick:0.05, expiry:"25-Sep-2026" },
    { id:"BANKFUT",      symbol:"BANKNIFTY",     name:"BANKNIFTY Future",         exchange:"NSE", segment:"futures", price:null, lotSize:30,  multiplier:1, tick:0.05, expiry:"30-Sep-2026" },
    { id:"NIFTY25000CE", symbol:"NIFTY 25000 CE",name:"NIFTY Call Option",        exchange:"NSE", segment:"options", price:null,   lotSize:75,  multiplier:1, tick:0.05, expiry:"25-Sep-2026", strike:25000, optionType:"CE" },
    { id:"NIFTY25000PE", symbol:"NIFTY 25000 PE",name:"NIFTY Put Option",         exchange:"NSE", segment:"options", price:null,   lotSize:75,  multiplier:1, tick:0.05, expiry:"25-Sep-2026", strike:25000, optionType:"PE" },
    { id:"GOLD",         symbol:"GOLD",          name:"Gold Futures",             exchange:"MCX", segment:"commodity", price:null, lotSize:100, multiplier:1, tick:1,    expiry:"05-Oct-2026" },
    { id:"CRUDE",        symbol:"CRUDEOIL",      name:"Crude Oil Futures",        exchange:"MCX", segment:"commodity", price:null,  lotSize:100, multiplier:1, tick:1,    expiry:"17-Sep-2026" },
    { id:"USDINR",       symbol:"USDINR",        name:"US Dollar / INR",          exchange:"NSE", segment:"forex", price:null, lotSize:1000,multiplier:1, tick:.0025,expiry:"29-Sep-2026" },
    { id:"EURINR",       symbol:"EURINR",        name:"Euro / INR",               exchange:"NSE", segment:"forex", price:null,lotSize:1000,multiplier:1, tick:.0025,expiry:"29-Sep-2026" }
  ]
};

const KEY = "tredin_clean_v1";
const fresh = {
  user: {},
  marketQuotes: {},
  funds: { available: 0, used: 0, blocked: 0, withdrawable: 0, marginLimit: null },
  orders: [], executions: [], positions: [], holdings: [], watchlist: [], ledger: [], notifications: [], activity: [], fundRequests: [],
  depositFlow: { step: 1, amount: "", method: "", confirmed: false },
  withdrawFlow: { step: 1, amount: "", bank: "", confirmed: false },
  kyc: { step: 1, status: "NOT_STARTED", personal: {}, pan: {}, bank: {}, ipv: {}, esign: {}, nominee: {}, docs: {} },
  profile: {}
};

let state = load();
function load() { return structuredClone(fresh); }
function save() { /* Server-authoritative state: mutations are committed through API responses. */ }
function icon3d(name,tone='blue'){return `<span class="ti3d ${tone}" aria-hidden="true">${iconSvg(name)}</span>`;}


/* API CONTRACT: UI components must consume state only; API adapters can replace
   the state/service layer later without changing routes, cards, or interaction markup. */

/* ---------- Helpers ---------- */
function instrument(id) { return MASTER.instruments.find(x => x.id === id); }
function money(n) { return n == null || Number.isNaN(Number(n)) ? "—" : "₹" + Number(n).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function num(n, d = 2) { return n == null || Number.isNaN(Number(n)) ? "—" : Number(n).toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d }); }
function current(i) { return state.marketQuotes?.[i]?.price ?? null; }
function grossPnL(p) {
  const i = instrument(p.instrument);
  const q = p.qty * (i?.lotSize || 1) * (i?.multiplier || 1);
  const px = current(p.instrument);
  return p.side === "BUY" ? (px - p.avg) * q : (p.avg - px) * q;
}
function slRisk(p) {
  const i = instrument(p.instrument);
  const q = p.qty * (i?.lotSize || 1) * (i?.multiplier || 1);
  if (p.sl == null) return 0;
  return p.side === "BUY" ? (p.avg - p.sl) * q : (p.sl - p.avg) * q;
}
function targetReward(p) {
  const i = instrument(p.instrument);
  const q = p.qty * (i?.lotSize || 1) * (i?.multiplier || 1);
  if (p.target == null) return 0;
  return p.side === "BUY" ? (p.target - p.avg) * q : (p.avg - p.target) * q;
}
function rr(p) { const r = slRisk(p); return r ? targetReward(p) / r : 0; }
function charges(order) {
  const value = order.qty * (instrument(order.instrument)?.lotSize || 1) * order.price;
  return Math.max(20, value * 0.00025);
}
function toast(t) {
  const e = document.getElementById("toast");
  e.textContent = t;
  e.style.display = "block";
  clearTimeout(window.__toast);
  window.__toast = setTimeout(() => e.style.display = "none", 2800);
}
/* Production interaction lock — prevents double submits before backend exists */
window.__tredinBusy = false;
function setBusy(on, msg) {
  window.__tredinBusy = !!on;
  if (on && msg) toast(msg);
}
function preApiBanner() {
  return "";
}
function uiSafe() {
  // Don't full-redraw while user is typing in a form or a modal is open
  if (document.getElementById("modalbg")?.style.display === "flex") return false;
  const a = document.activeElement;
  if (a && (a.tagName === "INPUT" || a.tagName === "SELECT" || a.tagName === "TEXTAREA")) return false;
  return true;
}
function notify(text) {
  state.notifications.unshift({ id: Date.now(), text, read: false });
  save();
  render();
}
function openModal(html) {
  document.getElementById("modal").innerHTML = html;
  document.getElementById("modalbg").style.display = "flex";
}
function closeModal() { document.getElementById("modalbg").style.display = "none"; }
document.getElementById("modalbg").addEventListener("click", e => {
  if (e.target.id === "modalbg") closeModal();
});

/* ---------- STEP 6: Secure authentication + session boundary ---------- */
const AUTH_KEY="tredin_session_v1", AUTH_MAX_AGE_MS=8*60*60*1000;
function authMode(){return window.TREDIN_API?.mode||"live"}
function getSession(){try{return JSON.parse(sessionStorage.getItem(AUTH_KEY)||"null")}catch{return null}}
function setSession(v){sessionStorage.setItem(AUTH_KEY,JSON.stringify(v))}
function clearSession(){sessionStorage.removeItem(AUTH_KEY)}
function isLoggedIn(){const s=getSession();return !!(s?.token&&(!s.at||Date.now()-s.at<AUTH_MAX_AGE_MS))}
function showAuthGate(show){const g=document.getElementById("authGate"),a=document.getElementById("workspaceApp");if(g)g.style.display=show?"flex":"none";if(a)a.style.display=show?"none":"";const p=document.getElementById("authModePill");if(p)p.textContent="SECURE LOGIN";const o=document.getElementById("authOtpWrap");if(o)o.style.display="none"}
function authError(msg){const e=document.getElementById("authErr");if(!e)return;e.style.display=msg?"block":"none";e.textContent=msg||""}
function authChallengeError(d){return d&&(d.requiresOtp||d.otpRequired||d.verificationRequired)?"Additional verification is required. The backend must provide the confirmed OTP verification contract before this step can be completed.":null}
async function authSubmit(){const id=(document.getElementById("authId")?.value||"").trim(),pass=document.getElementById("authPass")?.value||"";authError("");if(!id||!pass)return authError("Enter your email/mobile and password.");const b=document.getElementById("authSubmitBtn");if(b){b.disabled=true;b.textContent="Signing in…"}try{const r=await window.TREDIN_API.auth.login({identifier:id,password:pass}),d=r?.data||{};if(!r?.ok)throw new Error(r?.message||"Unable to sign in.");const ch=authChallengeError(d);if(ch)throw new Error(ch);const token=d.accessToken||d.token;if(!token)throw new Error("Authentication response is missing a session token.");setSession({token,refreshToken:d.refreshToken||null,user:d.user||null,at:Date.now()});showAuthGate(false);location.hash="#/home";render()}catch(e){authError(apiErrorMessage(e,"Sign in failed. Please try again."))}finally{if(b){b.disabled=false;b.textContent="Sign in"}}}
async function authLogout(){try{await window.TREDIN_API.auth.logout()}catch(e){}clearSession();showAuthGate(true);location.hash="#/login"}
async function refreshAccessToken(){const s=getSession();if(!s?.refreshToken)return false;try{const r=await window.TREDIN_API.auth.refresh(),d=r?.data||{},token=d.accessToken||d.token;if(!token)return false;setSession({...s,token,refreshToken:d.refreshToken||s.refreshToken,at:Date.now(),user:d.user||s.user});return true}catch(e){clearSession();showAuthGate(true);return false}}
/* ---------- Router ---------- */
function navigate(route, params = {}) {
  const q = new URLSearchParams();
  if (params.id) q.set("id", params.id);
  if (params.side) q.set("side", params.side);
  const qs = q.toString();
  window.location.hash = "#/" + route + (qs ? "?" + qs : "");
}
function parse() {
  const s = location.hash.replace(/^#\//, "") || "home";
  const [r, q] = s.split("?");
  const p = new URLSearchParams(q || "");
  return { route: r || "home", id: p.get("id"), side: p.get("side") };
}
window.addEventListener("hashchange", render);

function head(title, sub, actions = "") {
  return `<div class="page-head"><div><h1>${title}</h1><div class="sub">${sub || ""}</div></div><div class="row">${actions}</div></div>`;
}
function metric(label, value, note = "") {
  return `<div class="card kpi-card"><div class="label">${label}</div><div class="metric">${value}</div>${note ? `<div class="kpi-note">${note}</div>` : ""}</div>`;
}
function detailRow(a, b) {
  return `<tr><td class="muted">${a}</td><td><strong>${b}</strong></td></tr>`;
}
function cardInstrument(i) {
  return `<div class="card instrument">
    <div><h3>${i.symbol}</h3><div class="muted">${i.name} · ${i.exchange} · ${MASTER.segments[i.segment].name}</div></div>
    <div style="text-align:right">
      <div class="price">${num(i.price, i.price < 100 ? 4 : 2)}</div>
      <div class="positive">${i.change == null ? "—" : "+"+num(i.change, 2)+"%"}</div>
      <button class="btn ghost" onclick="navigate('instrumentHub',{id:'${i.id}'})">Open</button>
    </div>
  </div>`;
}
function chartSvg(){ return `<div class="chart-empty">Live chart will appear when market-feed data is connected.</div>`; }

function previewOrder() {
  const i = instrument(document.getElementById("oInstrument").value);
  const q = Number(document.getElementById("oQty").value);
  const price = Number(document.getElementById("oPrice").value);

  if (!q || q < 1) return toast("Enter a valid quantity.");
  if (i.segment !== "equity" && q !== Math.floor(q)) return toast("Quantity must be whole lots.");
  if (price <= 0) return toast("Enter a valid price.");
  const order = {
    instrument: i.id, side: window.ticketSide || "BUY", qty: q, price,
    type: document.getElementById("oType").value,
    product: document.getElementById("oProduct").value, sl, target
  };
  if (sl !== null && ((order.side === "BUY" && sl >= price) || (order.side === "SELL" && sl <= price)))
    return toast("Stop Loss direction is invalid.");
  if (target !== null && ((order.side === "BUY" && target <= price) || (order.side === "SELL" && target >= price)))
    return toast("Target direction is invalid.");
  const mult = i.lotSize * i.multiplier;
  const risk = sl !== null ? (order.side === "BUY" ? (price - sl) : (sl - price)) * q * mult : 0;
  const reward = target !== null ? (order.side === "BUY" ? (target - price) : (price - target)) * q * mult : 0;
  openModal(`<div class="modalhead"><h2>Order Preview</h2><button class="close" onclick="closeModal()">×</button></div>
    <p><span class="tag">${order.side}</span> <strong>${i.symbol}</strong> · ${i.exchange} · ${MASTER.segments[i.segment].name}</p>

}
function confirmOrder(o) {
  if (current(o.instrument) == null) return toast("Live market price is unavailable. Order submission is blocked until market data is connected.");
  if (window.__tredinBusy) return toast("Please wait — order request is already in progress.");
  if (!window.TREDIN_API?.orders?.create) return toast("Order API is not configured.");
  window.__tredinBusy = true; closeModal();
  const idempotencyKey = "ID-" + Date.now();
  tredinApiCall(() => window.TREDIN_API.orders.create({ ...o, idempotencyKey }), "Submitting order…")
    .then(r => {
      if (r?.data) state.orders = Array.isArray(r.data) ? r.data : (r.data.orders || state.orders);
      toast("Order submitted to server."); render();
    })
    .catch(e => toast(e.message || "Order submission failed."))
    .finally(() => { window.__tredinBusy = false; });
}
function tredinApiCall(fn, loadingText){
  if (loadingText) toast(loadingText);
  return Promise.resolve().then(fn);
}

/* ---------- Order lifecycle UI ---------- */
const ORDER_STAGES = ["CREATED","VALIDATING","RMS_CHECK","ACCEPTED","ROUTING","EXCHANGE_ACK","OPEN","FILLED"];
function lifecycleRail(status){
  const failed = status === "REJECTED";
  const idx = ORDER_STAGES.indexOf(status);
  return `<div class="lifecycle-rail" aria-label="Order execution lifecycle">${ORDER_STAGES.map((stage,i)=>{
    const cls = failed ? (i <= Math.max(0, idx) ? "done" : "") : (i < idx ? "done" : i === idx ? "current" : "");
    return `<div class="lifecycle-step ${cls}">${stage.replace("_"," ")}</div>`;
  }).join("")}</div>`;
}
function lifecycleMessage(status){
  const map={CREATED:"Order submitted to the backend; validation is starting.",VALIDATING:"Checking order fields and master-data rules.",RMS_CHECK:"Risk and margin checks are in progress.",ACCEPTED:"Backend RMS accepted the order; routing is next.",ROUTING:"Order is being prepared for exchange routing.",EXCHANGE_ACK:"Exchange acknowledgement received in server flow.",OPEN:"Order is open and awaiting execution.",FILLED:"Execution completed and position state updated.",REJECTED:"Order was rejected before execution."};
  return map[status] || "Order lifecycle state is being processed.";
}

function executeSquareOff() {
  const ps = [...state.positions];
  closeModal();
  ps.forEach((p, n) => setTimeout(() => {
    const i = instrument(p.instrument);
    confirmOrder({
      instrument: i.id, side: p.side === "BUY" ? "SELL" : "BUY",
      qty: p.qty, price: current(i.id), type: "Market",
      product: MASTER.segments[i.segment].product[0], sl: null, target: null

function setProtection(id) {
  const p = state.positions.find(x => x.id === id);
  const i = instrument(p.instrument);
  openModal(`<div class="modalhead"><h2>SL / Target</h2><button class="close" onclick="closeModal()">×</button></div>
    <p>${i.symbol} · ${p.side} · Avg ${money(p.avg)}</p>
    <div class="formgrid">
      <div class="field"><label>Stop Loss</label><input id="psl" type="number" step="any" value="${p.sl ?? ""}"></div>
      <div class="field"><label>Target</label><input id="ptarget" type="number" step="any" value="${p.target ?? ""}"></div>
    </div>
    <div class="section"><button class="btn primary" onclick="saveProtection('${id}')">Review & Save</button></div>`);
}
function saveProtection(id) {
  const p = state.positions.find(x => x.id === id);
  const sl = Number(document.getElementById("psl").value) || null;
  const target = Number(document.getElementById("ptarget").value) || null;
  if (sl !== null && ((p.side === "BUY" && sl >= p.avg) || (p.side === "SELL" && sl <= p.avg)))
    return toast("Invalid Stop Loss direction.");
  if (target !== null && ((p.side === "BUY" && target <= p.avg) || (p.side === "SELL" && target >= p.avg)))
    return toast("Invalid Target direction.");
  const r = sl ? Math.abs(p.avg - sl) * p.qty * (instrument(p.instrument).lotSize || 1) : 0;
  const rew = target ? Math.abs(target - p.avg) * p.qty * (instrument(p.instrument).lotSize || 1) : 0;
  openModal(`<div class="modalhead"><h2>Protection Preview</h2><button class="close" onclick="closeModal()">×</button></div>
    <p>SL Risk: <strong>${money(r)}</strong><br>
       Target Reward: <strong>${money(rew)}</strong><br>
       Risk/Reward: <strong>${r ? num(rew / r, 2) : "—"}</strong></p>
    <button class="btn primary" onclick='applyProtection(${JSON.stringify(id)},${JSON.stringify(sl)},${JSON.stringify(target)})'>Confirm</button>`);
}
function applyProtection(id, sl, target) {
  const p = state.positions.find(x => x.id === id);
  if (!p) return;
  p.sl = sl;
  p.target = target;
  state.activity.unshift({ time: Date.now(), event: "POSITION_PROTECTION_CHANGED", positionId: id });
  save();
  closeModal();
  render();
  toast("SL / Target updated.");
}

        </select>
      </div>
      <div class="section row">
        <button class="btn" onclick="depBack(2)">Back</button>
        <button class="btn primary" onclick="depNext(2)">Continue</button>
      </div>
    </div>`;
  }
  if (s === 3) {
    body += `<div class="card">
      <h2>3. Review Deposit</h2>

        ${detailRow("Amount", money(d.amount))}

    body += `<div class="card">

      <div class="section row">
        <button class="btn primary" onclick="navigate('funds')">Open Funds</button>
        <button class="btn" onclick="depReset()">New Deposit</button>
      </div>
    </div>`;
  }
  document.getElementById("app").innerHTML =
    head("Deposit Funds", "Amount → Method → Review → Status") + body;
}
function depNext(step) {
  const d = depositFlow();
  if (step === 1) {
    const a = Number(document.getElementById("depAmt")?.value || 0);
    if (a < 1) return toast("Enter a valid deposit amount.");
    d.amount = a; d.step = 2;
  } else if (step === 2) {
    const m = document.getElementById("depMethod")?.value || "";
    if (!m) return toast("Select a payment method.");
    d.method = m; d.step = 3;
  } else if (step === 3) {
    if (!document.getElementById("depConfirm")?.checked) return toast("Confirm the deposit details.");
    d.confirmed = true; d.step = 4;
    if (!window.TREDIN_API?.funds?.deposit) return toast("Deposit API is not configured.");
    return tredinApiCall(() => window.TREDIN_API.funds.deposit({ amount:Number(d.amount), method:d.method, idempotencyKey:(crypto?.randomUUID?.()||String(Date.now())) }), "Submitting deposit request…")
      .then(r => { d.step = 4; d.confirmed = true; state.depositFlow = d; if (r?.data?.funds) state.funds = r.data.funds; if (r?.data?.requests) state.fundRequests = r.data.requests; toast("Deposit request submitted."); deposit(); })
      .catch(e => toast(e.message || "Deposit request failed."));
  }
  saveDepositFlow(d);
  deposit();
}
function depBack(step) {
  const d = depositFlow();
  d.step = Math.max(1, step - 1);
  saveDepositFlow(d);
  deposit();
}
function depReset() {
  state.depositFlow = { step: 1, amount: "", method: "", confirmed: false };
  save();
  deposit();
}

/* ---------- KYC workflow (7 steps) ---------- */
function kycEditResubmit() {

function kycGet() {
  const base = {
    step: 1, status: "NOT_STARTED",
    personal: {}, pan: {}, bank: {}, ipv: {}, esign: {}, nominee: {},
    docs: {}
  };
  if (!state.kyc) return structuredClone(base);
  if (!state.kyc.docs) state.kyc.docs = {};
  return state.kyc;
}
function kycSave(k) { state.kyc = k; }
function stepLabel(n, t, cur) {
  return `<div class="kyc-step ${n === cur ? "current" : ""} ${n < cur ? "done" : ""}"><b>${n}</b><span>${t}</span></div>`;
}
/* Document upload slot — UI ready for POST /kyc/documents; backend handles upload progress */
const KYC_DOC_RULES = {
  PAN: { label: "PAN document", accept: "image/jpeg,image/png,application/pdf", maxMb: 5, required: true },
  BANK_PROOF: { label: "Bank proof (cheque / statement)", accept: "image/jpeg,image/png,application/pdf", maxMb: 5, required: false },
  PHOTO: { label: "Photograph / selfie", accept: "image/jpeg,image/png", maxMb: 2, required: true }
};
function kycDocState(docType) {
  return (kycGet().docs || {})[docType] || { status: "EMPTY" };
}
function uploadSlotHtml(docType) {
  const rule = KYC_DOC_RULES[docType];
  const d = kycDocState(docType);
  const st = d.status || "EMPTY";
  const cls = st === "UPLOADED" ? "is-ok" : st === "FAILED" ? "is-fail" : st === "UPLOADING" ? "is-uploading" : "";
  let body = "";
  if (st === "EMPTY" || st === "FAILED") {
    body = `<input type="file" accept="${rule.accept}" onchange="kycStartUpload('${docType}', this)">
      ${st === "FAILED" ? `<p class="us-file" style="color:var(--bad);margin-top:8px">${esc(d.error || "Upload failed")}</p>` : ""}`;
  } else if (st === "UPLOADING") {
    body = `<div class="us-progress"><i style="width:${d.progress || 10}%"></i></div>
      <p class="us-meta">Uploading ${esc(d.fileName || "")}… ${d.progress || 0}%</p>`;
  } else if (st === "UPLOADED") {
    body = `<p class="us-file">Selected · ${esc(d.fileName)} · ${esc(d.sizeLabel || "")}</p>
      <p class="us-meta">Backend upload required before this document receives a server document ID.</p>
      <div class="row" style="margin-top:8px">
        <button type="button" class="btn" onclick="kycReplaceDoc('${docType}')">Replace</button>
        <button type="button" class="btn danger" onclick="kycRemoveDoc('${docType}')">Remove</button>
      </div>`;
  }
  return `<div class="upload-slot ${cls}" id="slot-${docType}">
    <p class="us-title">${rule.label}${rule.required ? " *" : ""}</p>
    <p class="us-meta">PDF / JPG / PNG · max ${rule.maxMb} MB</p>
    ${body}
  </div>`;
}
function kycStartUpload(docType, input) {
  const rule = KYC_DOC_RULES[docType];
  const file = input && input.files && input.files[0];
  if (!file) return;
  const k = kycGet();
  k.docs = k.docs || {};
  const maxBytes = rule.maxMb * 1024 * 1024;
  const okType = /^(image\/(jpeg|png)|application\/pdf)$/i.test(file.type) || /\.(pdf|jpe?g|png)$/i.test(file.name);
  if (!okType) {
    k.docs[docType] = { status: "FAILED", error: "File type not allowed. Use PDF or JPG/PNG." };
    kycSave(k); kyc(); return toast("File type not allowed");
  }
  if (file.size > maxBytes) {
    k.docs[docType] = { status: "FAILED", error: `File too large. Maximum ${rule.maxMb} MB.` };
    kycSave(k); kyc(); return toast("File too large");
  }
  k.docs[docType] = { status: "READY_FOR_UPLOAD", fileName: file.name, contentType: file.type || "application/octet-stream", sizeBytes: file.size, sizeLabel: (file.size / 1024).toFixed(0) + " KB" };
  kycSave(k); kyc();
  toast("Document selected. Backend document upload is required before submission.");
}
function kycReplaceDoc(docType) {
  return toast("KYC document API is not configured. Document replacement is blocked until backend upload contract is connected.");
}
function kycRemoveDoc(docType) {
  return toast("KYC document removal API is not configured. No local document state was changed.");
}
function kyc() {
  const k = kycGet();
  const locked = k.status === "SUBMITTED" || k.status === "IN_REVIEW" || k.status === "APPROVED";
  const step = Math.max(1, Math.min(7, k.step || 1));
  const labels = ["Personal", "PAN / KYC", "Bank", "IPV", "eSign", "Nominee", "Review"];
  const statusTag =
    k.status === "APPROVED" || k.status === "ACTIVE" ? "good" :
    k.status === "REJECTED" ? "bad" :
    k.status === "SUBMITTED" || k.status === "IN_REVIEW" ? "warn" : "warn";
  let body;
  if (k.status === "SUBMITTED" || k.status === "IN_REVIEW") {
    body = `<div class="card kyc-card">
      <div class="ui-state info">Application ${k.status === "IN_REVIEW" ? "in review" : "submitted"}</div>
      <h2 style="margin-top:14px">Verification in progress</h2>

    </div>`;
  } else if (k.status === "APPROVED" || k.status === "ACTIVE") {
    body = `<div class="card kyc-card">
      <div class="ui-state success">KYC approved</div>
      <p class="muted" style="margin-top:12px">Account opening verification is complete.</p>
      <button class="btn primary" onclick="navigate('home')">Go to Home</button>

  } else if (k.status === "REJECTED") {
    body = `<div class="card kyc-card">

      <p style="margin-top:12px">${esc(k.rejectNote || "Please fix the issues and resubmit.")}</p>
      <button class="btn primary" onclick="kycEditResubmit()">Edit & resubmit</button>
    </div>`;
  } else {
    body = `<div class="kyc-steps">${labels.map((x, i) => stepLabel(i + 1, x, step)).join("")}</div>
     <div class="card kyc-card">${kycStepContent(step, k)}</div>`;
  }
  document.getElementById("app").innerHTML =
    head("Account Opening & KYC", locked ? "Application under verification" : "Complete each step, then submit for review",
      `<span class="tag ${statusTag}">${k.status}</span>
       <button class="btn" onclick="navigate('account')">Account</button>`) + body;

    const mode = document.getElementById("kBankMode")?.value || "Penny Drop";
    if (!name || account.length < 6 || !/^[A-Z]{4}0[A-Z0-9]{6}$/.test(ifsc) || !holder)
      return toast("Complete valid bank details.");
    if (mode === "Cancelled Cheque" && kycDocState("BANK_PROOF").status !== "UPLOADED")
      return toast("Upload bank proof for cancelled cheque mode.");
    k.bank = {
      name, account: "••••" + account.slice(-4), ifsc, holder, mode, verified: false,
      documentId: kycDocState("BANK_PROOF").documentId || null
    };
  }
  if (s === 4) {
    if (kycDocState("PHOTO").status !== "UPLOADED") return toast("Upload photograph for IPV.");
    if (!document.getElementById("kIpvAgree")?.checked) return toast("Confirm IPV to continue.");
    k.ipv = { confirmed: true, time: new Date().toISOString(), photoDocumentId: kycDocState("PHOTO").documentId };
  }
  if (s === 5) {
    if (!document.getElementById("kEsignAgree")?.checked) return toast("Provide eSign consent to continue.");
    k.esign = { consent: true, time: new Date().toISOString() };
  }
  if (s === 6) {
    const na = document.getElementById("kNomNA")?.checked;
    const name = document.getElementById("kNomName")?.value.trim() || "";
    const relationship = document.getElementById("kNomRel")?.value.trim() || "";
    const dob = document.getElementById("kNomDob")?.value || "";
    const share = Number(document.getElementById("kNomShare")?.value || 0);
    if (!na && (!name || !relationship || !dob || share < 1 || share > 100))
      return toast("Complete nominee details or select not applicable.");
    k.nominee = na ? { na: true } : { na: false, name, relationship, dob, share };
  }
  k.step = s + 1;
  k.status = "IN_PROGRESS";
  kycSave(k);
  state.activity.unshift({ time: Date.now(), event: "KYC_STEP_COMPLETED", detail: { step: s }, source:"client-draft" });
  save();
  kyc();
}

<script id="tredin-step7-live-trading">
/* STEP 7 — LIVE MARKET / ORDER EXECUTION BOUNDARY
   No client-side prices, ticks, fills, positions, or order lifecycle simulation.
   Market/order state is hydrated from the backend and remains server-authoritative.
*/
(function(){
  window.TREDIN_LIVE = window.TREDIN_LIVE || {marketReady:false,realtimeReady:false,loading:false,lastSync:null,error:null};
  const unwrap = r => r && r.data != null ? r.data : r;
  const listOf = (d, keys) => {
    if (Array.isArray(d)) return d;
    for (const k of keys) if (Array.isArray(d?.[k])) return d[k];
    return [];
  };
  function applyInstruments(rows){
    if (!Array.isArray(rows) || !rows.length) return false;
    const normalized = rows.map(x => ({...x, price: x.ltp ?? x.lastPrice ?? x.price ?? null}));
    MASTER.instruments = normalized;
    return true;
  }
  function applyQuotes(rows){
    if (!Array.isArray(rows)) return false;
    const byId = new Map(rows.map(x => [String(x.instrumentId ?? x.id ?? x.symbol), x]));
    MASTER.instruments = MASTER.instruments.map(i => {
      const q = byId.get(String(i.id)) || byId.get(String(i.symbol));
      return q ? {...i, ...q, price:q.ltp ?? q.lastPrice ?? q.price ?? i.price} : i;
    });
    return true;
  }
  async function hydrateLiveTrading(){
    if (window.TREDIN_LIVE.loading || !window.TREDIN_API?.baseUrl) return;
    window.TREDIN_LIVE.loading=true; window.TREDIN_LIVE.error=null;
    try {
      const [ir,qr,or,pr] = await Promise.all([
        window.TREDIN_API.market.instruments(),
        window.TREDIN_API.market.quotes(),
        window.TREDIN_API.orders.list(),
        window.TREDIN_API.positions.list()
      ]);
      const instruments=listOf(unwrap(ir),['instruments','items','results']);
      const quotes=listOf(unwrap(qr),['quotes','items','results']);
      if (instruments.length) applyInstruments(instruments);
      if (quotes.length) applyQuotes(quotes);
      const orders=listOf(unwrap(or),['orders','items','results']);
      const positions=listOf(unwrap(pr),['positions','items','results']);
      if (orders.length || Array.isArray(unwrap(or))) state.orders=orders;
      if (positions.length || Array.isArray(unwrap(pr))) state.positions=positions;
      window.TREDIN_LIVE.marketReady = !!(instruments.length || quotes.length);
      window.TREDIN_LIVE.lastSync = new Date().toISOString();
      if (typeof render==='function') render();
    } catch(e){
      window.TREDIN_LIVE.error = e?.message || 'Live trading data unavailable.';
      toast(window.TREDIN_LIVE.error);
    } finally { window.TREDIN_LIVE.loading=false; }
  }
  function startRealtime(){
    /* Transport is deliberately not invented. Backend must supply the agreed WS/SSE URL and event schema. */
    window.TREDIN_LIVE.realtimeReady=false;
  }
  window.TREDIN_LIVE.hydrate = hydrateLiveTrading;
  window.TREDIN_LIVE.startRealtime = startRealtime;

  const originalConfirmOrder = window.confirmOrder;
  window.confirmOrder = function(o){
    if (!window.TREDIN_API?.orders?.create) return toast('Order API is not configured.');
    if (!o?.instrument || !o?.side || !o?.qty || !o?.type) return toast('Complete the order fields before submission.');
    if (window.__tredinBusy) return toast('Please wait — order request is already in progress.');
    window.__tredinBusy=true; closeModal();
    const key = (crypto.randomUUID ? crypto.randomUUID() : 'ID-'+Date.now());
    const payload = {...o, idempotencyKey:key};
    tredinApiCall(()=>window.TREDIN_API.orders.create(payload),'Submitting order to backend…')
      .then(r=>{
        const d=unwrap(r); const incoming=listOf(d,['orders','items','results']);
        if (incoming.length) state.orders=incoming;
        else if (d && typeof d==='object') state.orders=[d,...(state.orders||[])];
        toast('Order accepted by backend. Execution status will update from server events/API.');
        window.dispatchEvent(new Event('tredin:server-state-changed')); render();
      })
      .catch(e=>toast(e?.message||'Order submission failed.'))
      .finally(()=>{window.__tredinBusy=false;});
  };

  /* Prevent client-side mark-to-market from pretending to be a live quote source. */
  const originalCurrent = window.current;
  window.current = function(id){ return Number(instrument(id)?.price ?? 0); };
  window.applyTrade = function(){ toast('Positions are updated only after backend execution.'); };
  window.simulateFill = function(){ toast('Client-side fills are disabled.'); };
  window.fillOrder = function(){ toast('Execution events must come from the backend.'); };
  window.advanceOrder = function(){ toast('Order lifecycle is backend-authoritative.'); };

  /* Initial MASTER catalogue is not treated as market data; remove client price values.
     Backend instruments/quotes replace it when the API base URL is configured. */
  MASTER.instruments = MASTER.instruments.map(i=>({...i,price:null}));
  hydrateLiveTrading();
  startRealtime();
})();
</script>
<script id="tredin-step9-sync">
/* STEP 9 — CUSTOMER ↔ BACKEND SYNCHRONIZATION
   Backend is the single source of truth. No cross-role browser-state bridge,
   no client financial reconciliation, and no fabricated real-time events.
*/
(function(){
  const LIVE = window.TREDIN_SYNC = window.TREDIN_SYNC || {inFlight:false,lastSync:null,error:null,source:"backend"};
  const unwrap = r => r && r.data != null ? r.data : r;
  const arr = (d, keys) => { if(Array.isArray(d)) return d; for(const k of keys){ if(Array.isArray(d?.[k])) return d[k]; } return []; };
  const replace = (key, data, keys=[]) => { const a=arr(data,keys); if(a.length || Array.isArray(data)) state[key]=a; return a; };
  async function syncCustomer(){
    if(LIVE.inFlight || !isLoggedIn() || !window.TREDIN_API?.baseUrl) return false;
    LIVE.inFlight=true; LIVE.error=null;
    try{
      const jobs = await Promise.allSettled([
        window.TREDIN_API.account.me(),
        window.TREDIN_API.funds.summary(),
        window.TREDIN_API.funds.ledger(),
        window.TREDIN_API.orders.list(),
        window.TREDIN_API.positions.list(),
        window.TREDIN_API.account.kyc()
      ]);
      const [me,funds,ledger,orders,positions,kyc]=jobs;
      if(me.status==='fulfilled'){ const d=unwrap(me.value); state.user=d?.user||d?.data||d||{}; if(state.user?.marginLimit!=null) state.funds.marginLimit=state.user.marginLimit; }
      if(funds.status==='fulfilled'){ const d=unwrap(funds.value); state.funds={...state.funds,...(d?.funds||d?.summary||d||{})}; }
      if(ledger.status==='fulfilled') replace('ledger',unwrap(ledger.value),['ledger','items','entries']);
      if(orders.status==='fulfilled') replace('orders',unwrap(orders.value),['orders','items','results']);
      if(positions.status==='fulfilled') replace('positions',unwrap(positions.value),['positions','items','results']);
      if(kyc.status==='fulfilled'){ const d=unwrap(kyc.value); state.kyc=d?.kyc||d?.application||d||state.kyc; }
      LIVE.lastSync=new Date().toISOString();
      if(typeof render==='function') render();
      return true;
    }catch(e){ LIVE.error=e?.message||'Backend synchronization failed.'; console.warn('TredIN sync',e); return false; }
    finally{ LIVE.inFlight=false; }
  }
  function markStale(){ LIVE.stale=true; }
  window.TREDIN_SYNC.customer=syncCustomer;
  window.TREDIN_SYNC.markStale=markStale;
  window.addEventListener('focus',()=>{ if(LIVE.stale) syncCustomer(); });
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && LIVE.stale) syncCustomer(); });
  window.addEventListener('tredin:server-state-changed',()=>syncCustomer());
  const oldRender=window.render;
  window.render=function(){ const r=oldRender.apply(this,arguments); if(window.TREDIN_API?.baseUrl && isLoggedIn() && !LIVE.lastSync) syncCustomer(); return r; };
  syncCustomer();
})();
</script>
